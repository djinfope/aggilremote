name: Build AggilRemote Pro Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Código (Recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Personalizar Branding e Interface
        shell: bash
        run: |
          # 1. Alterar o Nome da Janela e do Serviço
          # Usamos uma abordagem menos agressiva para não quebrar as aspas do Rust
          sed -i 's/"RustDesk"/"AggilRemote"/g' libs/hbb_common/src/config.rs
          
          # 2. Habilitar a Instalação (Isso é essencial para rodar como serviço)
          sed -i 's/const DISABLE_INSTALL: bool = true/const DISABLE_INSTALL: bool = false/g' libs/hbb_common/src/config.rs
          
          # 3. Habilitar Acesso por IP Direto
          sed -i 's/direct_ip_access = false/direct_ip_access = true/g' libs/hbb_common/src/config.rs

          # 4. Substituir Ícones e Logos (Onde o branding realmente aparece)
          # Garantindo que os arquivos existam antes de copiar
          [ -f branding/icon.ico ] && cp branding/icon.ico res/icon.ico
          [ -f branding/icon.ico ] && cp branding/icon.ico res/tray-icon.ico
          [ -f branding/logo.png ] && cp branding/logo.png res/logo.png

      - name: Instalar Dependências (vcpkg)
        run: |
          vcpkg install --triplet x64-windows-static --vcpkg-root "C:\vcpkg" --classic libvpx libyuv opus aom dav1d

      - name: Compilar Executável
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          # Compilação limpa
          cargo build --release
          if (Test-Path "target/release/rustdesk.exe") {
              Copy-Item -Path "target/release/rustdesk.exe" -Destination "target/release/AggilRemote.exe"
          }

      - name: Gerar Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: AggilRemote
          path: target/release/AggilRemote.exe

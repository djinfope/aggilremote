name: Build AggilRemote Pro Custom

on:
  workflow_dispatch: # Disparo manual na aba Actions

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Código (Recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Dependências VCPKG
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static

      - name: Personalizar Branding, Interface e Permissões
        shell: bash
        run: |
          # 1. Identidade, Copyright e Servidor
          sed -i 's/RustDesk/AggilRemote/g' libs/hbb_common/src/config.rs
          sed -i 's/Purslane Ltd/DJ Info PE Tecnologia/g' libs/hbb_common/src/config.rs
          sed -i "s/rs-ny.rustdesk.com/remote.djinfope.com.br/g" libs/hbb_common/src/config.rs
          sed -i "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ secrets.MY_KEY }}|g" libs/hbb_common/src/config.rs
          
          # 2. Links de Suporte e Atualização
          sed -i 's|https://rustdesk.com|https://www.djinfope.com.br|g' libs/hbb_common/src/config.rs
          sed -i 's|https://rustdesk.com/download|https://www.djinfope.com.br/atualizacao/AggilRemote.exe|g' libs/hbb_common/src/config.rs
          
          # 3. Recursos de Interface e Acessibilidade
          # Ativa o Direct IP Access (Acesso Direto por IP)
          sed -i 's/direct_ip_access = false/direct_ip_access = true/g' libs/hbb_common/src/config.rs
          
          # Exibe o "X" para dispositivos offline no Address Book
          sed -i 's/display_offline_addressbook = false/display_offline_addressbook = true/g' libs/hbb_common/src/config.rs
          
          # Adiciona botão de ciclo de monitores na Toolbar
          sed -i 's/toolbar_monitor_switch = false/toolbar_monitor_switch = true/g' libs/hbb_common/src/config.rs
          
          # 4. Comportamento e Instalação (Instalação ATIVA agora)
          sed -i 's/remove_wallpaper = false/remove_wallpaper = true/g' libs/hbb_common/src/config.rs
          sed -i 's/const DISABLE_INSTALL: bool = true/const DISABLE_INSTALL: bool = false/g' libs/hbb_common/src/config.rs
          
          # 5. Segurança e Acesso Bidirecional
          # Trava as configurações para o usuário final (como no seu print)
          sed -i 's/can_change_settings = true/can_change_settings = false/g' libs/hbb_common/src/config.rs
          sed -i 's/const CAN_HIDE_SCREEN: bool = false/const CAN_HIDE_SCREEN: bool = true/g' libs/hbb_common/src/config.rs
          
          # Garante funcionamento Bidirecional
          sed -i 's/const ONLY_OUTGOING: bool = true/const ONLY_OUTGOING: bool = false/g' libs/hbb_common/src/config.rs
          sed -i 's/const ONLY_INCOMING: bool = true/const ONLY_INCOMING: bool = false/g' libs/hbb_common/src/config.rs

          # 6. Aplicar Branding Visual (Imagens da sua pasta branding)
          cp branding/icon.ico res/icon.ico
          cp branding/icon.ico res/tray-icon.ico
          cp branding/logo.png res/logo.png
          cp branding/privacy.png res/privacy.png

      - name: Compilar Executável (.exe)
        run: |
          cargo build --release

      - name: Gerar Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: AggilRemote
          path: target/release/rustdesk.exe
